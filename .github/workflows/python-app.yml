# RentHunter - Monitoramento de Imóveis
# OLX e Zap rodam em paralelo em jobs separados.
# Um job de commit/notify aguarda ambos terminarem.

name: RentHunter - Monitoramento de Imóveis

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: 1
  TZ: America/Sao_Paulo

# ─────────────────────────────────────────────
# JOB 1 — OLX
# ─────────────────────────────────────────────
jobs:
  renthunter-olx:
    name: 🏠 Scan OLX
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏠 Run RentHunter OLX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}        
        run: python renthunter_v3.py

      - name: 📤 Upload OLX data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olx-data-${{ github.run_id }}
          path: data/
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2 — ZAP
  # ─────────────────────────────────────────────
  renthunter-zap:
    name: 🏢 Scan Zap Imóveis
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏢 Run RentHunter Zap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python renthunter_zap_v2.py

      - name: 📤 Upload Zap data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-data-${{ github.run_id }}
          path: data/zap/
          retention-days: 1

  renthunter-quintoandar:
    name: 🏞️ Scan Quinto Andar
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏢 Run RentHunter Quinto Andar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python renthunter_quintoandar.py

      - name: 📤 Upload Quinto Andar data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quintoandar-data-${{ github.run_id }}
          path: data/quintoandar/
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3 — COMMIT + NOTIFY (aguarda os dois)
  # ─────────────────────────────────────────────
  commit-and-notify:
    name: 📤 Commit & Notify
    runs-on: ubuntu-latest
    environment: prod
    needs: [renthunter-olx, renthunter-zap, renthunter-quintoandar]
    if: always()

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Baixar artifacts gerados pelos dois jobs
      - name: 📥 Download OLX data
        uses: actions/download-artifact@v4
        with:
          name: olx-data-${{ github.run_id }}
          path: data/

      - name: 📥 Download Zap data
        uses: actions/download-artifact@v4
        with:
          name: zap-data-${{ github.run_id }}
          path: data/zap/

      - name: 📤 Commit results
        run: |
          git config --global user.name  "RentHunter Bot"
          git config --global user.email "renthunter@bot.local"

          git add -A data/

          git commit -m "🏠 Update: Daily RentHunter scan $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || true

          git push origin HEAD:main

      - name: 📊 Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renthunter-logs-${{ github.run_id }}
          path: |
            data/logs/
            data/zap/logs/
            data/quintoandar/logs/
          retention-days: 30

      # ── Telegram ──────────────────────────────
      - name: 🔔 Telegram — sucesso
        if: >
          needs.renthunter-olx.result == 'success' &&
          needs.renthunter-zap.result == 'success' &&
          needs.renthunter-quintoandar.result == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE="✅ RentHunter Scan Concluído

          Hora: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          OLX: ✅ sucesso
          Zap: ✅ sucesso
          Quinto Andar: ✅ sucesso"

            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"$TELEGRAM_CHAT_ID\",\"text\":\"$MESSAGE\"}" \
              https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage || true
          fi

      - name: 🔔 Telegram — falha parcial ou total
        if: >
          needs.renthunter-olx.result != 'success' ||
          needs.renthunter-zap.result != 'success' ||
          needs.renthunter-quintoandar.result != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            OLX_STATUS="${{ needs.renthunter-olx.result }}"
            ZAP_STATUS="${{ needs.renthunter-zap.result }}"
            QUINTOANDAR_STATUS="${{ needs.renthunter-quintoandar.result }}"

            MESSAGE="⚠️ RentHunter Scan com problemas

          Hora: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          OLX: $OLX_STATUS
          Zap: $ZAP_STATUS
          Quinto Andar: $QUINTOANDAR_STATUS
          Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"$TELEGRAM_CHAT_ID\",\"text\":\"$MESSAGE\"}" \
              https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage || true
          fi